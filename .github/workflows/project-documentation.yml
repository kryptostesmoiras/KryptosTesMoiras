name: Publish project documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.markdown'
      - License
      - 'github/pages/**'
      - '.github/workflows/project-documentation.yml'
  workflow_dispatch:
  schedule:
    - cron: '2-57/15 * * * *'

permissions:
  contents: write
  pages: write
  actions: read
  discussions: read

concurrency:
  group: project-documentation-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the existing project Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/project-pages.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/project-pages.json') as stream:
              pages = json.load(stream)
          source = pages.get('source') or {}
          if pages.get('build_type') == 'workflow' or not source.get('branch') or source.get('path') not in ['/', '/docs']:
              raise SystemExit('Expected the existing branch-based project Pages source.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('branch=' + source['branch'] + '\n')
              output.write('path=' + source['path'] + '\n')
          print('Using the existing Pages branch and directory:', source['branch'], source['path'])
          PY

      - name: Check out the existing Pages branch separately
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pages.outputs.branch }}
          path: _project-pages
          persist-credentials: false

      - name: Read public Discussions metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_PATH: ${{ steps.pages.outputs.path }}
        run: |
          set -euo pipefail
          gh api repos/kryptostesmoiras/kryptostesmoiras.github.io > "$RUNNER_TEMP/discussions-repository.json"
          enabled=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("has_discussions",False)).lower())' "$RUNNER_TEMP/discussions-repository.json")
          export DISCUSSIONS_ENABLED="$enabled"
          if [[ "$enabled" == true ]]; then
            gh api graphql -f query='query { repository(owner:"kryptostesmoiras", name:"kryptostesmoiras.github.io") { discussions(first:30, orderBy:{field:UPDATED_AT,direction:DESC}) { nodes { title url comments { totalCount } } } } }' > "$RUNNER_TEMP/discussions.json"
          fi
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os
          enabled = os.environ['DISCUSSIONS_ENABLED'] == 'true'
          items = []
          if enabled:
              data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'discussions.json').read_text())
              items = [{'title': row['title'], 'url': row['url'], 'comments': row['comments']['totalCount']}
                       for row in data['data']['repository']['discussions']['nodes']]
          payload = {'enabled': enabled,
              'url': 'https://github.com/kryptostesmoiras/kryptostesmoiras.github.io/discussions',
              'items': items}
          previous_path = Path('_project-pages') / os.environ['PAGES_PATH'].lstrip('/') / 'discussions.json'
          try:
              previous = json.loads(previous_path.read_text())
          except (OSError, ValueError):
              previous = {}
          checked = previous.pop('checkedAt', None)
          payload['checkedAt'] = checked if previous == payload and checked else datetime.now(timezone.utc).isoformat()
          target = Path('github/pages/public/KryptosTesMoiras/discussions.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: github/pages/package-lock.json

      - name: Install locked dependencies
        working-directory: github/pages
        run: npm ci --no-audit --no-fund

      - name: Build documentation and license only
        working-directory: github/pages
        run: npm run build:docs

      - name: Publish generated documentation without replacing source files
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_PATH: ${{ steps.pages.outputs.path }}
          PAGES_BRANCH: ${{ steps.pages.outputs.branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, shutil, subprocess
          source = Path('github/pages/dist-project-docs')
          target = Path('_project-pages') / os.environ['PAGES_PATH'].lstrip('/')
          target.mkdir(parents=True, exist_ok=True)
          manifest = target / 'project-pages-assets.json'
          try:
              old_files = json.loads(manifest.read_text()).get('files', [])
          except (OSError, ValueError):
              old_files = []
          files = [p.relative_to(source).as_posix() for p in source.rglob('*') if p.is_file()]
          for name in set(old_files) - set(files):
              old = target / name
              if old.resolve().is_relative_to(target.resolve()) and old.is_file():
                  old.unlink()
          for name in files:
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source / name, destination)
          (target / '.nojekyll').touch()
          manifest.write_text(json.dumps({'files': files}, indent=2) + '\n')
          prefix = os.environ['PAGES_PATH'].lstrip('/')
          managed = [str(Path(prefix) / name) for name in set(old_files + files + ['.nojekyll', 'project-pages-assets.json'])]
          subprocess.run(['git', '-C', '_project-pages', 'add', '--all', '--', *managed], check=True)
          PY
          git -C _project-pages config user.name 'github-actions[bot]'
          git -C _project-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C _project-pages diff --cached --quiet; then
            git -C _project-pages commit -m 'Publish project Markdown and license reader'
            git -C _project-pages -c credential.helper= -c credential.helper='!gh auth git-credential' push origin "HEAD:$PAGES_BRANCH"
          fi

      - name: Request and verify project Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(git -C _project-pages rev-parse HEAD)
          requests=0
          last_request=-3
          for attempt in $(seq 1 40); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/pages-build.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$expected&per_page=50" > "$RUNNER_TEMP/pages-runs.json"
            read -r commit build_state native_state < <(python3 - "$RUNNER_TEMP/pages-build.json" "$RUNNER_TEMP/pages-runs.json" "$expected" <<'PYSTATUS'
          import json, sys
          build = json.load(open(sys.argv[1]))
          runs = json.load(open(sys.argv[2])).get('workflow_runs', [])
          native = [run for run in runs if run.get('head_sha') == sys.argv[3]
                    and ('pages-build-deployment' in run.get('path', '')
                         or run.get('name') == 'pages build and deployment')]
          if any(run.get('conclusion') == 'success' for run in native):
              state = 'success'
          elif any(run.get('status') in ['queued', 'in_progress', 'waiting', 'pending'] for run in native):
              state = 'in_progress'
          else:
              state = 'missing_or_failed'
          print(build.get('commit', 'unknown'), build.get('status', 'unknown'), state)
          PYSTATUS
            )
            if [[ "$commit" == "$expected" && "$build_state" == 'built' && "$native_state" == 'success' ]]; then
              echo "Confirmed actual project Pages deployment for $expected"
              exit 0
            fi
            if [[ "$native_state" == 'in_progress' || "$build_state" == 'queued' || "$build_state" == 'building' ]]; then
              sleep 15
              continue
            fi
            if [[ $((attempt - last_request)) -ge 4 ]]; then
              if [[ "$requests" -ge 4 ]]; then
                echo 'Pages did not confirm publication after four spaced build requests.' >&2
                exit 1
              fi
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
              requests=$((requests + 1))
              last_request=$attempt
            fi
            sleep 15
          done
          echo 'No successful Pages deployment was confirmed for the expected commit before timeout.' >&2
          exit 1
